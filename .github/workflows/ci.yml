name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  # vcpkg.json makes this the default in recent vcpkg, but keep it explicit
  # for older toolsets.
  VCPKG_FEATURE_FLAGS: manifests

jobs:
  # The repo's own Windows presets (CMakePresets.json) pin an exact MSVC
  # toolset patch version ("version=14.50.35717") that isn't guaranteed to
  # exist anywhere but the original dev machine (confirmed: it doesn't
  # match locally either), so these legs use the "Visual Studio 18 2026"
  # generator directly against CMakeLists.txt without a toolset override,
  # rather than going through `cmake --preset`.
  #
  # Note: an earlier attempt used ilammy/msvc-dev-cmd + Ninja to sidestep
  # generator-version matching entirely, but that action's environment
  # activation sets its own VCPKG_ROOT pointing at VS's bundled (non-git)
  # vcpkg copy — a user-managed checkout this repo's CMakeLists.txt
  # neither pins nor updates, so builds there wouldn't use the audited
  # pinned revision. The VS generator doesn't need a pre-activated dev
  # environment, so it doesn't hit that.
  #
  # Also: -DCMAKE_TOOLCHAIN_FILE can't point directly at
  # .vcpkg/scripts/buildsystems/vcpkg.cmake -- CMake resolves that argument
  # at command-line parse time, before CMakeLists.txt's own vcpkg clone step
  # has run, so the not-yet-existing path is silently dropped ("Ignoring
  # extra path from command line"), leaving vcpkg's toolchain never
  # included at all. Pointing at the repo's own
  # cmake/windows-x86-64/toolchain.cmake instead works because that file
  # already exists in git; its include() of vcpkg.cmake is only evaluated
  # later, once project() runs -- by which point the clone has happened.
  windows:
    name: Windows-${{ matrix.name }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MSVC
            cc: cl
            cxx: cl
            toolset: ""
          - name: ClangCL
            cc: clang-cl
            cxx: clang-cl
            toolset: "-T ClangCL"

    # Third-party actions are pinned by commit SHA (tags are mutable, so
    # a compromised action author could otherwise run arbitrary code in
    # this workflow); Dependabot (.github/dependabot.yml) proposes pin
    # updates.
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # cmake_minimum_required(VERSION 4.2) is newer than what's preinstalled
      # on GitHub-hosted runners.
      - name: Install CMake >= 4.2
        uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2
        with:
          cmakeVersion: "4.4.2"

      - name: Cache vcpkg
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .vcpkg
            ~/AppData/Local/vcpkg/archives
          key: vcpkg-windows-x64-windows-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-windows-x64-windows-

      - name: Configure
        shell: pwsh
        # --toolchain (not -DCMAKE_TOOLCHAIN_FILE=) with an absolute path:
        # -D was truncating the value at its last dot ("Ignoring extra path
        # from command line: '.cmake'", leaving CMAKE_TOOLCHAIN_FILE set to
        # the extension-less "cmake/windows-x86-64/toolchain" and failing
        # with "Could not find toolchain file").
        run: >
          cmake -B build -S .
          -G "Visual Studio 18 2026" -A x64 ${{ matrix.toolset }}
          -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          --toolchain "${{ github.workspace }}/cmake/windows-x86-64/toolchain.cmake"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        working-directory: build
        run: ctest -C Release --output-on-failure --parallel
